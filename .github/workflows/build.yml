name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          arguments: build

      - name: Probe API (temporary)
        if: always()
        run: |
          JAVAP=$(find / -name javap -path "*bin*" 2>/dev/null | head -1)
          J=build/moddev/artifacts/minecraft-patched-26.2.0.88.jar
          unzip -l $J | grep -i "pick" | head -20 || true
          for c in net.minecraft.client.renderer.GameRenderer net.minecraft.client.Minecraft net.minecraft.client.player.LocalPlayer net.minecraft.world.entity.Entity; do echo "=== $c"; $JAVAP -cp $J -p $c | grep -i "HitResult\|pick" || true; done
