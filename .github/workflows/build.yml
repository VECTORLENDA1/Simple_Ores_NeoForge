name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          arguments: build

      - name: Probe API (temporary)
        if: always()
        run: |
          JAVAP=$(find / -name javap -path "*bin*" 2>/dev/null | head -1)
          J=build/moddev/artifacts/minecraft-patched-26.2.0.88.jar
          $JAVAP -cp $J -p net.minecraft.client.renderer.GameRenderer | grep -i "pick\|hitresult" 
          $JAVAP -cp $J -p net.minecraft.client.Minecraft | grep -i "hitResult\|crosshair"
          $JAVAP -cp $J -p net.minecraft.world.phys.AABB | grep -i "clip"
