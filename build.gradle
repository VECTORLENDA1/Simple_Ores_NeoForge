plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = mod_version
group = mod_group_id

base {
	archivesName = mod_id
}

sourceSets.main.resources {
	// Include resources generated by data generators.
	srcDir('src/generated/resources')

	// Exclude common development only resources from finalized outputs
	exclude("**/*.bbmodel") // BlockBench project files
	exclude(".cache/**") // datagen cache files
}

repositories {
	maven {
		// location of the maven that hosts JEI files since January 2023
		name = "Jared's maven"
		url = "https://maven.blamejared.com/"
	}
	maven {
		// location of a maven mirror for JEI files, as a fallback
		name = "ModMaven"
		url = "https://modmaven.dev"
	}
	maven {
		// WTHIT (shows what is inside the Gravity Core when looking at it)
		name = "WTHIT"
		url = "https://maven2.bai.lol"
	}
}

loom {
	mods {
		"${mod_id}" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// JEI is optional: only its API is used to compile (see compat/)
	compileOnly "mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}"

	// WTHIT is optional: only its API is used to compile (see compat/wthit)
	compileOnly "mcp.mobius.waila:wthit-api:fabric-${wthit_version}"
}

processResources {
	def props = [version: project.version, mod_id: mod_id]
	inputs.properties props

	filesMatching("fabric.mod.json") {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
		maven {
			url "file://${project.projectDir}/repo"
		}
	}
}
